{{- if .Values.postgrest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supabase.fullname" . }}-postgrest
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "supabase.componentLabels" (dict "root" . "component" "postgrest") | nindent 4 }}
spec:
  replicas: {{ .Values.postgrest.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "supabase.componentSelectorLabels" (dict "root" . "component" "postgrest") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "supabase.componentSelectorLabels" (dict "root" . "component" "postgrest") | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "supabase.fullname" . }}-postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: postgrest
          image: "{{ .Values.postgrest.image.repository }}:{{ .Values.postgrest.image.tag }}"
          imagePullPolicy: {{ .Values.postgrest.image.pullPolicy | default "IfNotPresent" }}
          env:
            # PGRST_DB_URI stored as a computed secret in Infisical (kept in sync
            # with POSTGRES_PASSWORD). Rationale: postgrest image is distroless
            # and lacks /bin/sh, so we can't compose the URI at container start.
            - name: PGRST_DB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.secrets.secretName | default "supabase-secrets" }}
                  key: PGRST_DB_URI
            - name: PGRST_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.secrets.secretName | default "supabase-secrets" }}
                  key: PGRST_JWT_SECRET
            - name: PGRST_DB_SCHEMAS
              value: {{ .Values.postgrest.schemas | default "public" | quote }}
            - name: PGRST_DB_ANON_ROLE
              value: {{ .Values.postgrest.anonRole | default "anon" | quote }}
            - name: PGRST_DB_USE_LEGACY_GUCS
              value: "false"
          ports:
            - containerPort: 3000
              name: http
          resources:
            {{- toYaml .Values.postgrest.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supabase.fullname" . }}-postgrest
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "supabase.componentLabels" (dict "root" . "component" "postgrest") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "supabase.componentSelectorLabels" (dict "root" . "component" "postgrest") | nindent 4 }}
{{- end }}
