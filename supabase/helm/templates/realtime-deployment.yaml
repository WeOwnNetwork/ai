{{- if .Values.realtime.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supabase.fullname" . }}-realtime
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "supabase.componentLabels" (dict "root" . "component" "realtime") | nindent 4 }}
spec:
  replicas: {{ .Values.realtime.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "supabase.componentSelectorLabels" (dict "root" . "component" "realtime") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "supabase.componentSelectorLabels" (dict "root" . "component" "realtime") | nindent 8 }}
    spec:
      # Wait for postgres to accept TCP connections before starting.
      # Avoids the crash-loop-until-postgres-ready dance on first deploy.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "supabase.fullname" . }}-postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: realtime
          image: "{{ .Values.realtime.image.repository }}:{{ .Values.realtime.image.tag }}"
          imagePullPolicy: {{ .Values.realtime.image.pullPolicy | default "IfNotPresent" }}
          env:
            # DB — realtime uses individual env vars (not a composed URL), so we don't
            # need a computed DB_URI secret. POSTGRES_PASSWORD pulled directly.
            - name: DB_HOST
              value: {{ include "supabase.fullname" . }}-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ .Values.postgres.auth.database | quote }}
            - name: DB_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.secrets.secretName | default "supabase-secrets" }}
                  key: POSTGRES_PASSWORD
            - name: DB_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.secrets.secretName | default "supabase-secrets" }}
                  key: REALTIME_DB_ENC_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.secrets.secretName | default "supabase-secrets" }}
                  key: JWT_SECRET
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.secrets.secretName | default "supabase-secrets" }}
                  key: REALTIME_SECRET_KEY_BASE
            # Runtime config (matches supabase-docker template)
            - name: PORT
              value: "4000"
            - name: APP_NAME
              value: "realtime"
            - name: FLY_ALLOC_ID
              value: "fly123"
            - name: FLY_APP_NAME
              value: "realtime"
            - name: RLIMIT_NOFILE
              value: "10000"
            - name: ERL_AFLAGS
              value: "-proto_dist inet_tcp"
            - name: ENABLE_TAILSCALE
              value: "false"
            - name: DNS_NODES
              value: "''"
          ports:
            - containerPort: 4000
              name: http
          resources:
            {{- toYaml .Values.realtime.resources | nindent 12 }}
          # TCP probes — supabase/realtime health endpoint varies by version;
          # TCP proves the Erlang app is listening.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supabase.fullname" . }}-realtime
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "supabase.componentLabels" (dict "root" . "component" "realtime") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "supabase.componentSelectorLabels" (dict "root" . "component" "realtime") | nindent 4 }}
{{- end }}
