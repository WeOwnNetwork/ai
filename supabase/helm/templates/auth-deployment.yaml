{{- if .Values.auth.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supabase.fullname" . }}-auth
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "supabase.componentLabels" (dict "root" . "component" "auth") | nindent 4 }}
spec:
  replicas: {{ .Values.auth.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "supabase.componentSelectorLabels" (dict "root" . "component" "auth") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "supabase.componentSelectorLabels" (dict "root" . "component" "auth") | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z {{ include "supabase.fullname" . }}-postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: gotrue
          image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag }}"
          imagePullPolicy: {{ .Values.auth.image.pullPolicy | default "IfNotPresent" }}
          env:
            # DB URL — stored as a computed secret (kept in sync with POSTGRES_PASSWORD;
            # gotrue image is distroless-adjacent so we can't compose at runtime).
            # search_path=auth so gotrue's tables land in the auth schema (supabase convention).
            - name: GOTRUE_DB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.secrets.secretName | default "supabase-secrets" }}
                  key: GOTRUE_DB_DATABASE_URL
            - name: GOTRUE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.infisical.secrets.secretName | default "supabase-secrets" }}
                  key: GOTRUE_JWT_SECRET
            # API host/port
            - name: GOTRUE_API_HOST
              value: "0.0.0.0"
            - name: GOTRUE_API_PORT
              value: "9999"
            - name: GOTRUE_DB_DRIVER
              value: "postgres"
            # Public URLs
            - name: API_EXTERNAL_URL
              value: {{ .Values.auth.apiExternalURL | required "auth.apiExternalURL is required" | quote }}
            - name: GOTRUE_SITE_URL
              value: {{ .Values.auth.siteURL | required "auth.siteURL is required" | quote }}
            - name: GOTRUE_URI_ALLOW_LIST
              value: {{ .Values.auth.uriAllowList | quote }}
            - name: GOTRUE_DISABLE_SIGNUP
              value: {{ .Values.auth.disableSignup | quote }}
            # JWT config
            # (GOTRUE_JWT_DEFAULT_GROUP_NAME deprecated by supabase/gotrue fork — dropped)
            - name: GOTRUE_JWT_EXP
              value: {{ .Values.auth.jwtExp | quote }}
            - name: GOTRUE_JWT_ADMIN_ROLES
              value: {{ .Values.auth.jwtAdminRoles | quote }}
            - name: GOTRUE_JWT_AUD
              value: {{ .Values.auth.jwtAud | quote }}
            # Email
            - name: GOTRUE_EXTERNAL_EMAIL_ENABLED
              value: {{ .Values.auth.externalEmailEnabled | quote }}
            - name: GOTRUE_MAILER_AUTOCONFIRM
              value: {{ .Values.auth.mailerAutoconfirm | quote }}
          ports:
            - containerPort: 9999
              name: http
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supabase.fullname" . }}-auth
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "supabase.componentLabels" (dict "root" . "component" "auth") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9999
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "supabase.componentSelectorLabels" (dict "root" . "component" "auth") | nindent 4 }}
{{- end }}
