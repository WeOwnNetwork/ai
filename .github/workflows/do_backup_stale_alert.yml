name: DigitalOcean Stale Backup Alert

# Read-only backup audit for the three DigitalOcean teams, then a Kind 1
# note on the Buzz relay. stdout is discarded: this repository is public and
# Actions logs are public, and the report contains live addresses.
#
# Exit 0: no stale or unbacked resources, and the Buzz note was delivered.
# Exit 3: stale or unbacked resources were found, and the Buzz note was delivered.
#   The workflow treats 0 and 3 as success. Buzz is the alert.
# Any other exit, including an API error or a failed publish, fails the job.
# A missing NOSTR_PRIVATE_KEY skips publish, so the script exits 1.
#
# Secrets (GitHub Actions, never committed):
#   DIGITALOCEAN_TOKEN, DO_TOKEN_AGENCY, DO_TOKEN_BOM, NOSTR_PRIVATE_KEY
#   BUZZ_CHANNEL_ID       NIP-28 channel id; empty keeps a kind 1 root note
# Optional:
#   DO_EXTRA_TEAM_TOKENS  label:ENV_NAME mapping, not raw tokens
#   NOSTR_RELAY_URL       required wss:// URL when NOSTR_PRIVATE_KEY is set; no default
#   NOTIFICATION_PUBKEYS  optional comma-separated 64-hex public keys to mention
#                         A clean audit publishes two lines and does not mention them.

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Publish stale backup alert
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scripts/do-backup-monitor
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Offline self-check
        run: python check_stale_backups.py --self-check

      - name: Run backup audit and publish to Buzz
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DIGITALOCEAN_TEAM_NAME: We Own Labs
          DO_TOKEN_AGENCY: ${{ secrets.DO_TOKEN_AGENCY }}
          DO_TOKEN_BOM: ${{ secrets.DO_TOKEN_BOM }}
          DO_EXTRA_TEAM_TOKENS: ${{ secrets.DO_EXTRA_TEAM_TOKENS }}
          NOSTR_PRIVATE_KEY: ${{ secrets.NOSTR_PRIVATE_KEY }}
          NOSTR_RELAY_URL: ${{ secrets.NOSTR_RELAY_URL }}
          BUZZ_CHANNEL_ID: ${{ secrets.BUZZ_CHANNEL_ID }}
          NOTIFICATION_PUBKEYS: ${{ secrets.NOTIFICATION_PUBKEYS }}
        run: |
          set -euo pipefail
          if [ -z "${DIGITALOCEAN_TOKEN:-}" ]; then
            echo "::error::DIGITALOCEAN_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "${DO_TOKEN_AGENCY:-}" ] || [ -z "${DO_TOKEN_BOM:-}" ]; then
            echo "::error::DO_TOKEN_AGENCY and DO_TOKEN_BOM secrets are required"
            exit 1
          fi
          if [ -z "${DO_EXTRA_TEAM_TOKENS:-}" ]; then
            DO_EXTRA_TEAM_TOKENS="We Own Agency:DO_TOKEN_AGENCY,Burned Out Media:DO_TOKEN_BOM"
            export DO_EXTRA_TEAM_TOKENS
          fi
          if [ -z "${NOSTR_PRIVATE_KEY:-}" ]; then
            echo "::warning::NOSTR_PRIVATE_KEY is not set; the report will not be published"
          elif [ -z "${NOSTR_RELAY_URL:-}" ]; then
            echo "::error::NOSTR_RELAY_URL secret is required when NOSTR_PRIVATE_KEY is set"
            exit 1
          fi
          set +e
          python check_stale_backups.py > /dev/null
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 0 ] || [ "$EXIT_CODE" -eq 3 ]; then
            echo "Audit finished with exit code ${EXIT_CODE}. Proceeding..."
            exit 0
          fi
          echo "::error::Execution or publishing failed with exit code ${EXIT_CODE}."
          exit "$EXIT_CODE"
