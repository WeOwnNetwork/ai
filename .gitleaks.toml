# Gitleaks configuration for WeOwn AI Infrastructure
# https://github.com/gitleaks/gitleaks

title = "WeOwn AI Gitleaks Config"

[extend]
# Use default gitleaks rules
useDefault = true

# Allowlist for known false positives and test data
[allowlist]
description = "WeOwn AI allowlist"

# Files that are allowed to contain secret-like patterns
paths = [
    # Test files with intentional test secrets
    '''nextcloud/test-.*\.sh''',
    # Example/template files
    '''.*\.example''',
    '''.*\.example\..*''',
    # Jinja templates (contain placeholders)
    '''.*\.jinja''',
    # Historical files (deleted from current tree but present in old commits)
    # These contained real secrets; credentials should be considered compromised
    # and rotated. Listed here to allow pre-commit hooks to focus on new changes.
    '''sfo_infrastructure\.yaml''',
    '''sfo_backup\.yaml''',
    '''cluster-backup/.*''',
]

# Specific patterns that are not secrets
regexes = [
    # Placeholder patterns
    '''YOUR_[A-Z_]+''',
    '''CHANGE[_-]ME.*''',
    '''change[_-]me.*''',
    '''<[A-Z_]+>''',
    '''example\.com''',
    '''test(secret|password|key).*''',
    # The RFC 6455 example WebSocket nonce. `Sec-WebSocket-Key` is PROTOCOL
    # DATA, not a credential: the client sends it in the clear on every
    # upgrade and the server echoes back a hash of it — it authenticates
    # nothing. Scripts probing an endpoint's upgrade path hard-code the
    # spec's own example, which decodes to the words "the sample nonce".
    # Gitleaks' generic-api-key rule flags it on entropy alone (4.17); it
    # turned `main` red on 2026-08-16 and blocked every merge in the repo.
    #
    # Deliberately the LITERAL value rather than a `Sec-WebSocket-Key: .*`
    # pattern: a real credential pasted into that header still trips the scan.
    # (Note for future entries — these regexes match the SECRET, not the whole
    # line, so a pattern that includes the header name can never match.)
    '''dGhlIHNhbXBsZSBub25jZQ==''',
]

# Specific commits to ignore (if needed)
# commits = ["commit-sha"]

# Stop words - if these appear near a finding, ignore it
stopwords = [
    "example",
    "placeholder",
    "dummy",
    "sample",
    "test",
    "fake",
    "mock",
]
