# weown-billing - Production Inventory
# Usage: ansible-playbook site.yml -i inventories/prod.yml

all:
  children:
    keycloak:
      hosts:
        weown-billing:
          ansible_host:
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/weown-billing_id_ed25519
          app_dir: /opt/weown_billing
          domain: billing.weown.dev
          keycloak_image: reg.mini.dev/keycloak:26.7.0
          caddy_image: reg.mini.dev/caddy:2
          postgres_version: "16"
