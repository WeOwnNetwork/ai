# i.MAIT.bot — Hermes Agent + Caddy
# Secrets: host .env only (chmod 600). Do not put real values in this file.

services:
  imait-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: imait-bot:local
    container_name: imait-bot
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file:
      - .env
    environment:
      HERMES_BOT_NAME: ${HERMES_BOT_NAME:-i.MAIT.bot}
      BUZZ_RELAY_URL: ${BUZZ_RELAY_URL:?Set BUZZ_RELAY_URL in .env (https origin of the target Buzz community)}
      BUZZ_CHANNELS: ${BUZZ_CHANNELS:-}
      BUZZ_HOME_CHANNEL: ${BUZZ_HOME_CHANNEL:-}
      BUZZ_TRANSPORT: ${BUZZ_TRANSPORT:-websocket}
      BUZZ_CLI_PATH: /usr/local/bin/buzz
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8080"
    volumes:
      - hermes_data:/opt/data
      - ./config.yaml:/opt/data/config.yaml
      # rw so s6 setup can chown for the dropped hermes uid (ro 0600 root = EACCES)
      - ./.env:/opt/data/.env
    networks:
      - imaitnet
    # Do not cap_drop ALL / no-new-privileges here: the official image's
    # s6-overlay runs s6-applyuidgid and dies with "Operation not permitted",
    # then main-wrapper cannot cd /opt/data. Caddy keeps the hardened caps.
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      start_period: 45s
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.5"
        reservations:
          memory: 512M
          cpus: "0.5"

  caddy:
    image: caddy:2.8-alpine
    container_name: imait-bot-caddy
    restart: unless-stopped
    depends_on:
      imait-bot:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - imaitnet
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  hermes_data:
    name: imait_bot_hermes_data
  caddy_data:
    name: imait_bot_caddy_data
  caddy_config:
    name: imait_bot_caddy_config
  caddy_logs:
    name: imait_bot_caddy_logs

networks:
  imaitnet:
    name: imaitnet
    driver: bridge
