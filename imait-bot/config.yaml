# i.MAIT.bot Hermes gateway — non-secret defaults only.
# Instance overlay (relay, channels, secrets, model slug) lives in host `.env`
# and may be edited on the box. Do not put community URLs or channel UUIDs here.

display:
  name: i.MAIT.bot
  platforms:
    buzz:
      interim_assistant_messages: false
      tool_progress: off

# Provider is OpenRouter; pick the model slug per instance (`hermes model` or
# edit `default` on the host). Do not pin a team-specific model in git.
model:
  provider: openrouter
  default: openrouter/auto

gateway:
  platforms:
    buzz:
      enabled: true
      extra:
        # Compose injects BUZZ_RELAY_URL from host `.env`. Empty channels = all joined.
        relay_url: ""
        channels: []
        poll_interval: 4
        cli_path: /usr/local/bin/buzz
        require_mention: true
        allow_all_users: true

tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5
