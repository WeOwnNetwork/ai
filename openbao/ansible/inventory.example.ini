# Copy to inventory.ini and point at your POC box (a tofu-provisioned droplet).
# Use the tailnet alias, never a raw/public IP — matches the fleet convention.
#
# For a genuinely throwaway box with no encrypted volume, override the data dir:
#   openbao_data_dir=/var/lib/openbao  openbao_disable_mlock=true

[openbao]
openbao-poc  ansible_user=root

[openbao:vars]
# POC posture is the default; a real deployment sets these:
#   openbao_tls_disable=false
#   openbao_data_dir=/mnt/data/openbao        # the encrypted volume
#   openbao_sha256=<checksum of the release archive>
#   openbao_init_key_shares=5 openbao_init_key_threshold=3   # per §2.6
