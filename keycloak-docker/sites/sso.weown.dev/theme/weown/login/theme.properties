# WeOwn brand skin for Keycloak's built-in login theme.
#
# parent=keycloak.v2 inherits every login-flow FTL template (login, register,
# forgot-password, OTP, WebAuthn, error, required actions) unchanged — this
# theme adds no templates of its own, only a stylesheet layered on top (see
# styles= below). That keeps it compatible across Keycloak upgrades instead
# of forking FTL that would need re-syncing on every version bump.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/weown.css
scripts=js/weown.js
