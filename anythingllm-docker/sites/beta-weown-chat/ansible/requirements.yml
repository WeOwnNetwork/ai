# Ansible Galaxy requirements for the optional hardening play (harden.yml).
# Install once per operator workstation:
#   ansible-galaxy collection install -r ansible/requirements.yml
collections:
  # DevSec Hardening Framework — CIS/STIG-aligned os_hardening + ssh_hardening.
  # https://github.com/dev-sec/ansible-collection-hardening
  # Pinned EXACTLY (copilot-instructions 3.9): a range lets a new major of a
  # collection that runs as root on the droplet in unreviewed. 10.6.0 is what
  # the old ">=8.8.0" resolved to on a fresh install from 2026-05-26 on (so
  # also when this play was written, 2026-07-15). Bump it deliberately.
  - name: devsec.hardening
    version: "10.6.0"
