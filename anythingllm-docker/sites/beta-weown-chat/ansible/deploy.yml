          while IFS= read -r -d '' k; do
            [[ "$k" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] \
              || { unset KVJSON; echo "ERROR: refusing a key at weown/platform/beta-weown-chat: not a plain identifier (name not printed)"; exit 1; }
            case "$k" in
